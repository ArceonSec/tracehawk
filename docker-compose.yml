services:
  tracehawk:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env                              # All secrets loaded from .env — never hardcode values here
    volumes:
      - ./output:/output
      - trivy-cache:/home/tracehawk/.cache/trivy


  frontend:
    build: ./frontend
    ports:
      - "5173:8080"
    depends_on:
      - tracehawk

volumes:
  trivy-cache:
